  { binding = "RATE_LIMIT", id = "0ff217e78dc345089d3060b4304aeae1" }
]

# ANTHROPIC_API_KEY is NOT set here - it goes in as a secret instead, via:
#   wrangler secret put ANTHROPIC_API_KEY
# so it never ends up committed to source control.
