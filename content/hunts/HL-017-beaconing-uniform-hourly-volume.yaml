implementations:
  - platform: Microsoft Sentinel
    language: KQL
    query: |
      // Beaconing by uniform hourly connection volume - MDE aggregated reports
      // Requires: Aggregated reporting enabled per tenant
      let lookback = 7d;
      let bin_size = 1h;
      let total_bins = toint(lookback / bin_size);
      let min_active_hours = 12;        // present in at least this many hourly bins
      let min_active_ratio = 0.25;      // and across at least this share of the window
      let min_avg_conns = 20;           // roughly one connection every 3 minutes in an active hour
      let max_cv = 0.20;                // relative std dev of hourly counts, lower is more uniform
      let max_prevalence = 0.05;        // destination seen on no more than 5% of tenant devices
      let window_start = bin(ago(lookback), bin_size);
      let window_end = bin(now(), bin_size);
      let non_routable = dynamic([
          "0.0.0.0/8", "10.0.0.0/8", "100.64.0.0/10", "127.0.0.0/8", "169.254.0.0/16",
          "172.16.0.0/12", "192.0.0.0/24", "192.0.2.0/24", "192.88.99.0/24",
          "192.168.0.0/16", "198.18.0.0/15", "198.51.100.0/24", "203.0.113.0/24",
          "224.0.0.0/4", "240.0.0.0/4", "255.255.255.255/32"
      ]);
      let agg = materialize(
          DeviceNetworkEvents
          | where Timestamp >= window_start and Timestamp < window_end
          | where ActionType == "ConnectionSuccessAggregatedReport"
          | where isnotempty(RemoteIP)
          | extend RemoteIPNorm = iff(RemoteIP startswith "::ffff:", substring(RemoteIP, 7), RemoteIP)
          | where RemoteIPNorm !contains ":"
          | where ipv4_is_private(RemoteIPNorm) != true
          | where ipv4_is_in_any_range(RemoteIPNorm, non_routable) != true
          | extend ConnectionCount = toint(todynamic(AdditionalFields).uniqueEventsAggregated)
          | where ConnectionCount > 0
      );
      let tenant_devices = agg | summarize TenantDeviceCount = dcount(DeviceId) by TenantId;
      let destination_prevalence = agg | summarize DevicesContacting = dcount(DeviceId) by TenantId, RemoteIPNorm;
      agg
      | make-series ConnCounts = sum(ConnectionCount) default = 0
          on Timestamp from window_start to window_end step bin_size
          by TenantId, DeviceId, DeviceName, InitiatingProcessFileName, RemoteIPNorm, RemotePort
      | mv-apply ConnCount = ConnCounts to typeof(long), TimeBin = Timestamp to typeof(datetime) on (
            summarize ActiveHours  = countif(ConnCount > 0),
                      ActiveAvg    = avgif(ConnCount, ConnCount > 0),
                      ActiveStdev  = stdevif(ConnCount, ConnCount > 0),
                      TotalConns   = sum(ConnCount),
                      FirstActive  = minif(TimeBin, ConnCount > 0),
                      LastActive   = maxif(TimeBin, ConnCount > 0)
        )
      | extend ActiveRatio = round(todouble(ActiveHours) / total_bins, 2),
               CoeffOfVariation = round(iff(ActiveAvg > 0, ActiveStdev / ActiveAvg, 999.0), 3)
      | where ActiveHours >= min_active_hours
          and ActiveRatio >= min_active_ratio
          and ActiveAvg >= min_avg_conns
          and CoeffOfVariation <= max_cv
      // roll ports back up so one destination relationship is one row
      | summarize Ports = make_set(RemotePort, 20),
                  PortCount = dcount(RemotePort),
                  BestCoeffOfVariation = min(CoeffOfVariation),
                  ActiveHours = max(ActiveHours),
                  ActiveRatio = max(ActiveRatio),
                  PeakAvgConnsPerHour = toint(max(ActiveAvg)),
                  TotalConns = sum(TotalConns),
                  FirstActive = min(FirstActive),
                  LastActive = max(LastActive)
          by TenantId, DeviceId, DeviceName, InitiatingProcessFileName, RemoteIPNorm
      | lookup kind=leftouter destination_prevalence on TenantId, RemoteIPNorm
      | lookup kind=leftouter tenant_devices on TenantId
      | extend DevicePrevalence = round(todouble(DevicesContacting) / TenantDeviceCount, 3)
      | project TenantId, DeviceId, DeviceName, InitiatingProcessFileName, RemoteIPNorm, Ports, PortCount,
                FirstActive, LastActive, ActiveHours, ActiveRatio, PeakAvgConnsPerHour,
                BestCoeffOfVariation, TotalConns, DevicesContacting, DevicePrevalence
      | where DevicePrevalence <= max_prevalence
      | sort by BestCoeffOfVariation asc, TotalConns desc

